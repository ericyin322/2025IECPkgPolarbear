<!doctype html>
<html lang="zh-Hant">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Polar Bear Hunt — Three.js</title>
</head>

<body>
  <div id="ui">
    <div class="pill">分數：<span id="score">0</span> / 5</div>
    <div class="pill">狀態：<span id="status">等待開始</span></div>
    <div class="pill">時間：<span id="time">0.0s</span></div>

  </div>
  <div id="ui-qus">
    <div id="question"></div>
    <div id="options"></div>
  </div>
  <div id="hint">遇到海豹！請在 <b>1 秒</b>內按下 <b>空白鍵</b>！</div>
  <div id="overlay">
    <div id="panel">
      <h1>Polar Bear Hunt</h1>
      <p id="summary" style="display:none; margin-top:10px; font-weight:700;"></p>
      <p>北極熊在冰原漫步，偶爾會遇到海豹。</p><p>遇到海豹時你必須在 <b>5 秒內回答問題</b>  才能成功捕獲。</p>

      <button id="startBtn">Start Game</button>

    </div>
  </div>
  <!-- <div id="devArea">
    <canvas id="output_canvas"></canvas>
    <video id="input_video" autoplay playsinline></video>
  </div> -->
  <script type="module" src="/src/main.ts">


  </script>
</body>

</html>
